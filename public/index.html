<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invest With Clarity — Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="rail-mark">iC</div>
      <div class="rail-brand-text">
        <div class="rail-brand-name">Invest With Clarity</div>
        <div class="rail-brand-sub">Comment &rarr; DM Automation</div>
      </div>
    </div>

    <nav class="rail-nav" id="rail-nav">
      <div class="rail-section">Monitor</div>
      <a class="rail-link" href="#/overview"   data-route="overview">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Overview</span>
      </a>
      <a class="rail-link" href="#/posts"      data-route="posts">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        <span>Posts &amp; Reels</span>
        <span class="rail-count hidden" id="count-posts">0</span>
      </a>
      <a class="rail-link" href="#/campaigns"  data-route="campaigns">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
        <span>Campaigns</span>
        <span class="rail-count hidden" id="count-campaigns">0</span>
      </a>

      <div class="rail-section">Configure</div>
      <a class="rail-link" href="#/templates"  data-route="templates">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Message Templates</span>
      </a>
      <a class="rail-link" href="#/analytics"  data-route="analytics">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Analytics</span>
      </a>
      <a class="rail-link" href="#/logs"       data-route="logs">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Activity Logs</span>
      </a>

      <div class="rail-section">System</div>
      <a class="rail-link" href="#/connection" data-route="connection">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Instagram Connection</span>
      </a>
      <a class="rail-link" href="#/sandbox"    data-route="sandbox">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/></svg>
        <span>Test Sandbox</span>
      </a>
      <a class="rail-link" href="#/settings"   data-route="settings">
        <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="rail-foot">
      <div class="rail-status" id="rail-meta-status">
        <span class="rail-status-dot dot-warn"></span>
        <span>Checking connection&hellip;</span>
      </div>
      <button class="btn btn-danger btn-sm btn-block" id="btn-emergency">
        Emergency Stop
      </button>
    </div>
  </aside>

  <!-- ============ Main ============ -->
  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-icon rail-toggle" id="rail-toggle" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div>
        <div class="topbar-title" id="topbar-title">Overview</div>
        <div class="topbar-sub" id="topbar-sub">Loading&hellip;</div>
      </div>
      <div class="topbar-spacer"></div>
      <div id="topbar-actions" class="row"></div>
    </header>

    <main class="view" id="view">
      <div class="stat-grid">
        <div class="skeleton" style="height:96px"></div>
        <div class="skeleton" style="height:96px"></div>
        <div class="skeleton" style="height:96px"></div>
        <div class="skeleton" style="height:96px"></div>
      </div>
    </main>
  </div>
</div>

<div id="toasts"></div>
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
